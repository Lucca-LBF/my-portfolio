   position: left: 100%;

@keyframes flutuar {
    0% {
        transform: translateY(0);
    }

}
    nav ul {

        color: #a855f7;
    }
    .about-me {
        color: #a855f7;

    }
    body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #121212;
    overflow-x: hidden;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(circle at 20% 20%,
            rgba(164, 50, 226, 0.192),
            transparent 30%),
        radial-gradient(circle at 80% 70%,
            rgba(164, 50, 226, 0),
            transparent 35%),
        radial-gradient(circle at 50% 50%,
            rgba(120, 50, 255, 0.08),
            transparent 50%);

    animation: glowMove 12s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -2;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(164, 50, 226, 0.05) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(164, 50, 226, 0.05) 1px,
            transparent 1px
        );

    background-size: 50px 50px;
    pointer-events: none;
    z-index: -1;
}

@keyframes glowMove {
    from {
        transform: translate(-40px, -20px) scale(1);
    }

    to {
        transform: translate(40px, 20px) scale(1.15);
    }
}

</style>
